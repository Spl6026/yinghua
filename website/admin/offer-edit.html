 class="admin-status"><i></i> 示範模式</span></header><div class="admin-content"><div class="admin-page-heading"><div><p class="eyebrow">CONTENT MANAGEMENT / OFFERS</p><h1>編輯店家優惠</h1><p>優惠資料獨立儲存，儲存後同步至前台店家優惠專區。</p></div></div><section class="admin-panel"><form id="record-form" data-module="offers" data-mode="edit"><div class="admin-form-grid"><div class="admin-field full"><label for="offer-title">優惠標題 *</label><input id="offer-title" name="title" required placeholder="例如：秋日咖啡散步限定"></div><div class="admin-field"><label for="offer-merchant">合作店家 *</label><input id="offer-merchant" name="merchant" required placeholder="店家名稱"></div><div class="admin-field"><label for="offer-area">行政區</label><select id="offer-area" name="area"><option>北區</option><option>東區</option><option>香山區</option><option>新竹市</option></select></div><div class="admin-field full"><label for="offer-discount">優惠內容 *</label><input id="offer-discount" name="discount" required placeholder="例如：出示頁面享 9 折"></div><div class="admin-field"><label for="offer-start">開始日期</label><input id="offer-start" name="startDate" type="date"></div><div class="admin-field"><label for="offer-end">結束日期</label><input id="offer-end" name="endDate" type="date"></div><div class="admin-field"><label for="offer-status">上架狀態</label><select id="offer-status" name="status"><option>已發布</option><option>草稿</option></select></div><div class="admin-field"><label for="offer-image">圖片網址</label><input id="offer-image" name="image" type="url" placeholder="https://"></div><div class="admin-field full"><label for="offer-desc">優惠介紹</label><textarea id="offer-desc" name="desc" rows="5" placeholder="優惠說明與店家特色"></textarea></div><div class="admin-field full"><label for="offer-terms">使用方式與注意事項</label><textarea id="offer-terms" name="terms" rows="3" placeholder="兌換條件、限制與注意事項"></textarea></div></div><div class="admin-form-actions"><a class="button button-outline" href="offers.html">取消</a><button class="button button-dark" type="submit">儲存優惠 ↗</button></div><p cl

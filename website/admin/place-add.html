<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>新增景點｜映畫竹塹後台</title><link rel="stylesheet" href="../css/style.css"><script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script><script defer src="../js/app.js"></script><meta name="robots" content="noindex,nofollow,noarchive"><meta name="googlebot" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"></head><body><a class="skip-link" href="#main-content">跳到主要內容</a><div class="site-shell"><main id="main-content"><div class="admin-wrap"><aside class="admin-sidebar"><a class="admin-brand" href="index.html"><span class="brand-mark">映</span><span><b>映畫竹塹</b><small>管理後台</small></span></a><p class="admin-menu-label">CONTENT</p><a class="admin-nav" href="index.html">▦　總覽儀表板</a><a class="admin-nav" href="places.html" data-admin-tab="places">⌖　景點與店家</a><a class="admin-nav" href="films.html" data-admin-tab="films">▣　本週映演</a><a class="admin-nav" href="news.html" data-admin-tab="news">▤　消息與活動</a><a class="admin-nav" href="offers.html" data-admin-tab="offers">♧　店家優惠</a><a class="admin-nav" href="routes.html" data-admin-tab="routes">⌁　推薦行程</a><p class="admin-menu-label">SYSTEM</p><a class="admin-nav" href="admins.html" data-admin-tab="admins">♙　管理員管理</a><a class="admin-nav" href="permissions.html" data-admin-tab="permissions">⚿　權限設定</a><a class="admin-nav" href="members.html" data-admin-tab="members">♙　會員管理</a><a class="admin-nav" href="settings.html" data-admin-tab="settings">⚙　網站設定</a></aside><div class="admin-main"><header class="admin-topbar"><button class="admin-mobile-menu" type="button" aria-label="開啟後台導覽" aria-expanded="false">☰</button><a href="places.html" class="admin-preview">← 返回景點與店家</a><div>映畫竹塹 <b>/ 新增景點</b></div><span class="admin-status"><i></i> 示範模式</span></header><div class="admin-content"><div class="admin-page-heading"><div><p class="eyebrow">CONTENT MANAGEMENT / PLACES</p><h1>新增景點</h1><p>景點基本資料；此頁為獨立編輯介面。</p></div></div><section class="admin-panel"><form id="place-add-form" data-module="places" data-mode="add"><div class="admin-form-grid"><div class="admin-field full"><label for="google-short-url">Google 地圖短網址</label><div class="url-import"><input id="google-short-url" placeholder="貼上 Google Maps 短網址"><button type="button" class="button button-outline" id="parse-place-url">模擬解析現有景點 ↗</button></div><div class="admin-field"><label for="demo-place-select">選擇本站現有示範景點</label><select id="demo-place-select"><option value="1">新竹市影像博物館</option><option value="2">東門市場</option><option value="3">或者工藝櫥窗</option><option value="4">新竹公園・麗池</option><option value="5">或者咖啡</option><option value="6">山房選物所</option></select></div><p class="helper-text">示範會用現有景點資料帶入欄位；短網址離線無法展開，正式環境需由伺服器安全解析並呼叫 Places API。</p></div><div class="admin-field"><label for="place-name-input">景點名稱 *</label><input id="place-name-input" required></div><div class="admin-field"><label for="place-category-input">分類</label><select id="place-category-input"><option>景點</option><option>美食</option><option>在地店家</option></select></div><div class="admin-field"><label for="place-area-input">行政區</label><select id="place-area-input"><option>北區</option><option>東區</option><option>香山區</option></select></div><div class="admin-field"><label for="place-hours-input">營業時間</label><input id="place-hours-input"></div><div class="admin-field full"><label for="place-address-input">地址</label><input id="place-address-input"></div><div class="admin-field full"><label for="place-desc-input">景點介紹</label><textarea id="place-desc-input"></textarea></div></div><div class="admin-form-actions"><a class="button button-outline" href="places.html">取消</a><button class="button button-dark" type="submit">新增內容 ↗</button></div><p class="helper-text">示範資料儲存於本機瀏覽器；正式環境請串接後端 API。</p></form></section></div></div></div></main><div class="toast" id="toast" role="status" aria-live="polite"></div></div></body></html>

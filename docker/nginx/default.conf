# HTML stays static; PHP receives API requests only.
log_format yinghua '$time_iso8601 $request_method $uri $status request=$sent_http_x_request_id';
# [E-02] 網頁先使用 APP_URL 的同一個來源，避免 127.0.0.1 與 localhost
# 分開保存 Cookie／送出不同 Origin；API 仍由 PHP 嚴格驗證 Origin 與 CSRF。
map "${CANONICAL_ORIGIN}" $canonical_authority {
    ~^https?://(?<spl_canonical_authority>[^/]+) $spl_canonical_authority;
    default "";
}
# [E-26] query 僅映射到已發布分頁，不能把任意路徑拼進檔案來源。
map $arg_page $content_page {
    default invalid;
    "" 1;
    "~^[1-9][0-9]{0,4}$" $arg_page;
}
map $arg_type $content_news_type {
    default invalid;
    "" all;
    event event;
    city city;
}
map $uri $content_news_category {
    default $content_news_type;
    /activities.html event;
    /city-news.html city;
}
map $uri $content_news_kind {
    default invalid;
    /events.html events;
    /activities.html activities;
    /city-news.html city-news;
}
server {
    listen 80;
    server_name _;
    root /var/www/frontend;
    index index.html;
    charset utf-8;
    server_tokens off;
    # [E-29] FPM 不可達時仍非健康；不攔截 PHP 自己產生的 JSON 錯誤。
    error_page 502 503 504 =503 @service_unavailable;
    # [E-08] 不將 query、Cookie、Referer 或原始 IP 寫入存取紀錄。
    access_log /var/log/nginx/access.log yinghua;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 2s;
    fastcgi_connect_timeout 2s;
    fastcgi_read_timeout 15s;
    set $api_upstream ${API_UPSTREAM};
    set $canonical_origin "${CANONICAL_ORIGIN}";
    location ~ (^|/)\. { return 404; }
    location ~* \.(php|sql|md|ndjson|ya?ml|ini|xlsx|env)$ { return 404; }
    # [S E33/G33；E-34] 文字／XML由前端publisher同版產生，PHP只負責既有gate。
    location ~ ^/(?:robots\.txt|sitemap(?:-[1-9][0-9]*)?\.xml)$ {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 @publication_pending;
        root /var/www/publication/current;
        types { text/plain txt; application/xml xml; }
        try_files $uri =404;
    }
    # [E-18] 只有前端成功產生的版本可讀；下架／排程／失敗時不供應舊 HTML。
    location = / {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        rewrite ^ /index.html last;
    }
    # [S G5；E] 首頁同版不可用仍逐區塊呈現錯誤；保持503與不公開舊內容。
    location = /index.html {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 /_home_publication_error;
        root /var/www/publication/current;
        try_files $uri =503;
    }
    location = /_home_publication_error {
        internal;
        alias /var/www/frontend/home-unavailable.response;
        default_type text/html;
    }
    location = /home-unavailable.response { return 404; }
    location ~ ^/(?:explore|food|museum|cinema|routes|terms|privacy|site-map)\.html$|^/places/[a-z0-9-]+\.html$ {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 @publication_pending;
        root /var/www/publication/current;
        try_files $uri @attraction_alias;
    }
    # [E-25] 電影與景點使用同一發布版本，歷史電影網址使用獨立對照。
    location ~ ^/films/[a-z0-9-]+\.html$ {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 @publication_pending;
        root /var/www/publication/current;
        try_files $uri @film_alias;
    }
    location = /film-detail.html {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        try_files /__no_legacy_film__ @film_alias;
    }
    location @film_alias {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param REQUEST_URI /api/v1/films/resolve-url;
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_pass $api_upstream;
    }
    location ~ ^/(?:events|activities|city-news)\.html$ {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 @publication_pending;
        root /var/www/publication/current;
        try_files /_content_pages/$content_news_kind/$content_news_category/$content_page.html =404;
    }
    location ^~ /_content_pages/ { internal; return 404; }
    location = /offers.html {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 @publication_pending;
        root /var/www/publication/current;
        try_files /_content_pages/offers/active/$content_page.html =404;
    }
    location ~ ^/offers/[a-z0-9-]+\.html$ {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 @publication_pending;
        root /var/www/publication/current;
        try_files $uri @offer_alias;
    }
    location = /offer-detail.html {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        try_files /__no_legacy_offer__ @offer_alias;
    }
    location @offer_alias {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param REQUEST_URI /api/v1/offers/resolve-url;
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_pass $api_upstream;
    }
    location ~ ^/news/[a-z0-9-]+\.html$ {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 @publication_pending;
        root /var/www/publication/current;
        try_files $uri @news_alias;
    }
    location = /news-detail.html {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        try_files /__no_legacy_news__ @news_alias;
    }
    location @news_alias {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param REQUEST_URI /api/v1/news/resolve-url;
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_pass $api_upstream;
    }
    location = /_publication_gate {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param REQUEST_URI /api/v1/publication/access;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_pass_request_body off;
        fastcgi_pass $api_upstream;
    }
    location @publication_pending { return 503 "公開頁面暫時無法使用，請稍後重試。"; }
    location @service_unavailable { return 503 "服務暫時無法使用，請稍後重試。"; }
    location = /place-detail.html {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        try_files /__no_legacy_page__ @attraction_alias;
    }
    location @attraction_alias {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param REQUEST_URI /api/v1/attractions/resolve-url;
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_pass $api_upstream;
    }
    location /media/ {
        auth_request /_media_gate;
        error_page 403 =404 @media_not_found;
        error_page 500 502 503 504 =503 @service_unavailable;
        alias /var/www/media/;
        autoindex off;
        # 上傳後重新編碼的圖片，永遠不進 FastCGI。
        limit_except GET HEAD { deny all; }
    }
    location = /_media_gate {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param REQUEST_URI /api/v1/admin/media/access;
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_pass_request_body off;
        fastcgi_pass $api_upstream;
    }
    location @media_not_found { return 404; }
    client_max_body_size 10m;
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_pass $api_upstream;
        fastcgi_read_timeout 15s;
    }
    location / {
        if ($http_host != $canonical_authority) {
            return 302 $canonical_origin$request_uri;
        }
        try_files $uri $uri/ =404;
    }
}

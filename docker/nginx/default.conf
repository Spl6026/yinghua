# HTML 一律是靜態檔，只有 API 請求才會交給 PHP。
# 記錄處理時間與 PHP 回應狀態，才能分辨慢的是 Nginx 還是 PHP；仍不記 query、IP 與 Cookie。
log_format yinghua '$time_iso8601 $request_method $uri $status request=$sent_http_x_request_id time=$request_time upstream=$upstream_status upstream_time=$upstream_response_time';
# 網頁先統一導向 APP_URL 的來源，避免 127.0.0.1 與 localhost 各自保存 Cookie、
# 送出不同的 Origin；API 端仍由 PHP 嚴格驗證 Origin 與 CSRF。
map "${CANONICAL_ORIGIN}" $canonical_authority {
    ~^https?://(?<spl_canonical_authority>[^/]+) $spl_canonical_authority;
    default "";
}
# 會員專屬頁（行程、收藏、更改密碼）：連登入 cookie 都沒有就直接在伺服器端導向登入頁，
# 不先把頁面送出再由 JS 跳轉，畫面不會閃一下。帶 query 的網址（例如從「套用路線」帶過來的待辦）
# 仍交給頁面處理，才能保留待辦；cookie 存在但已過期時也一樣由頁面判斷。
map "$cookie_spl_member_session:$args" $member_page_needs_login {
    ":" 1;
    default 0;
}
# 快取策略：HTML 與 API 仍然 no-store，避免登入狀態或發布前後的頁面被留在瀏覽器；
# 頁面引用的 CSS／JS／圖示網址帶有內容版本號（?v=，見 frontend/scripts/asset-version.mjs），
# 檔案一改網址就跟著變，所以可以長期快取、換頁時不必再逐一向伺服器確認；
# 沒帶版本號的網址（例如手動輸入或 CSS 內引用的圖片）用 no-cache，每次以 ETag 確認，未變更時只回 304。
# 字型檔內容固定（雜湊記在 docs/FONT-ASSETS.json），更換時會改檔名，可以長時間快取。
map "$uri?$args" $asset_cache_control {
    default "no-store";
    "~^/assets/(?!fonts/)[^?]+\?v=[a-f0-9]{12}$" "public, max-age=31536000, immutable";
    ~^/assets/fonts/ "public, max-age=2592000";
    ~^/assets/ "no-cache";
    ~^/media/ "no-cache";
}
# query 只會對應到已發布的分頁，不能把任意路徑拼進檔案來源。
map $arg_page $content_page {
    default invalid;
    "" 1;
    "~^[1-9][0-9]{0,4}$" $arg_page;
}
map $arg_type $content_news_type {
    default invalid;
    "" all;
    event event;
    city city;
}
map $uri $content_news_category {
    default $content_news_type;
    /activities.html event;
    /city-news.html city;
}
map $uri $content_news_kind {
    default invalid;
    /events.html events;
    /activities.html activities;
    /city-news.html city-news;
}
server {
    listen 80;
    server_name _;
    root /var/www/frontend;
    index index.html;
    charset utf-8;
    server_tokens off;
    # FPM 連不上時要回報不健康；PHP 自己產生的 JSON 錯誤則不攔截。
    error_page 502 503 504 =503 @service_unavailable;
    # 公開網址不存在時顯示站內 404 頁；/api/ 不攔截，維持 JSON 錯誤格式。
    error_page 404 /404.html;
    # 自動補斜線等轉址只送相對路徑，前面若有代理或非 80 埠也不會轉到錯的位址。
    absolute_redirect off;
    # 存取紀錄不寫入 query、Cookie、Referer 或原始 IP，避免留下 token 等個資。
    access_log /var/log/nginx/access.log yinghua;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $asset_cache_control always;
    # 壓縮文字型靜態檔；API 的 JSON 不壓縮，避免含 token 的回應被 BREACH 類攻擊推測內容。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/xml text/plain;
    # 全站腳本都是同源的外部檔，所以 CSP 的 script-src 限制為 self；JSON-LD 與 JSON 資料區塊不會被當成腳本執行。
    # 其他資源預設只允許同源；圖片另允許 https（後台可填外部封面、海報網址）與 data:，
    # 樣式允許行內 style 屬性（發布頁卡片以 style 帶背景圖）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    # 網站用不到相機、麥克風、定位等裝置權限，明確關閉，嵌入的第三方內容也無法要求。
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 2s;
    fastcgi_connect_timeout 2s;
    fastcgi_read_timeout 15s;
    set $api_upstream ${API_UPSTREAM};
    set $canonical_origin "${CANONICAL_ORIGIN}";
    location ~ (^|/)\. { return 404; }
    location ~* \.(php|sql|md|ndjson|ya?ml|ini|xlsx|env)$ { return 404; }
    # robots.txt 與 sitemap 等文字／XML 檔由前端 publisher 隨同一版本產生，PHP 只負責既有的發布檢查。
    location ~ ^/(?:robots\.txt|sitemap(?:-[1-9][0-9]*)?\.xml)$ {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 @publication_pending;
        root /var/www/publication/current;
        types { text/plain txt; application/xml xml; }
        try_files $uri =404;
    }
    # 只有前端成功產生的版本可以讀取；下架、排程中或產生失敗時，不提供舊的 HTML。
    location = / {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        rewrite ^ /index.html last;
    }
    # 首頁的發布版本不可用時，仍逐區塊顯示錯誤；維持 503，也不公開舊內容。
    location = /index.html {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 /_home_publication_error;
        root /var/www/publication/current;
        try_files $uri =503;
    }
    location = /_home_publication_error {
        internal;
        alias /var/www/frontend/home-unavailable.response;
        default_type text/html;
    }
    location = /home-unavailable.response { return 404; }
    location = /404.html { internal; try_files /404.html =404; }
    location ~ ^/(?:explore|food|museum|cinema|routes|terms|privacy|site-map)\.html$|^/places/[a-z0-9-]+\.html$ {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 @publication_pending;
        root /var/www/publication/current;
        try_files $uri @attraction_alias;
    }
    # 電影與景點使用同一個發布版本，舊的電影網址另有獨立的對照表。
    location ~ ^/films/[a-z0-9-]+\.html$ {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 @publication_pending;
        root /var/www/publication/current;
        try_files $uri @film_alias;
    }
    # 原型以 ?id= 開啟的詳情頁沒有實體檔案；try_files 刻意指向不存在的檔名，讓請求一定交給具名 location 查出正式網址。
    location = /film-detail.html {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        try_files /__resolve_film_detail__ @film_alias;
    }
    location @film_alias {
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param REQUEST_URI /api/v1/films/resolve-url;
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_pass $api_upstream;
    }
    location ~ ^/(?:events|activities|city-news)\.html$ {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 @publication_pending;
        root /var/www/publication/current;
        error_page 404 /404.html;
        try_files /_content_pages/$content_news_kind/$content_news_category/$content_page.html =404;
    }
    location ^~ /_content_pages/ { internal; return 404; }
    location = /offers.html {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 @publication_pending;
        root /var/www/publication/current;
        error_page 404 /404.html;
        try_files /_content_pages/offers/active/$content_page.html =404;
    }
    location ~ ^/offers/[a-z0-9-]+\.html$ {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 @publication_pending;
        root /var/www/publication/current;
        try_files $uri @offer_alias;
    }
    location = /offer-detail.html {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        try_files /__resolve_offer_detail__ @offer_alias;
    }
    location @offer_alias {
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param REQUEST_URI /api/v1/offers/resolve-url;
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_pass $api_upstream;
    }
    location ~ ^/news/[a-z0-9-]+\.html$ {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        auth_request /_publication_gate;
        error_page 403 500 502 503 504 =503 @publication_pending;
        root /var/www/publication/current;
        try_files $uri @news_alias;
    }
    location = /news-detail.html {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        try_files /__resolve_news_detail__ @news_alias;
    }
    location @news_alias {
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param REQUEST_URI /api/v1/news/resolve-url;
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_pass $api_upstream;
    }
    location = /_publication_gate {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param REQUEST_URI /api/v1/publication/access;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_pass_request_body off;
        fastcgi_pass $api_upstream;
    }
    # 公開頁暫時無法提供時回一頁簡短的 HTML 說明（明確指定類型，否則可能被當成檔案下載）。
    # 這幾個錯誤位置刻意不加 add_header：location 內只要有 add_header，伺服器層級的安全標頭就不會再套用。
    location @publication_pending {
        default_type "text/html; charset=utf-8";
        return 503 '<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>暫時無法使用｜映畫竹塹</title><p style="font:16px/1.8 sans-serif;max-width:32em;margin:15vh auto;padding:0 20px">公開頁面暫時無法使用，請稍後重新整理。<br><a href="/">回到首頁</a></p></html>';
    }
    location @service_unavailable {
        default_type "text/html; charset=utf-8";
        return 503 '<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>暫時無法使用｜映畫竹塹</title><p style="font:16px/1.8 sans-serif;max-width:32em;margin:15vh auto;padding:0 20px">服務暫時無法使用，請稍後重新整理。</p></html>';
    }
    location = /place-detail.html {
        if ($http_host != $canonical_authority) { return 302 $canonical_origin$request_uri; }
        try_files /__resolve_place_detail__ @attraction_alias;
    }
    location @attraction_alias {
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param REQUEST_URI /api/v1/attractions/resolve-url;
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_pass $api_upstream;
    }
    location /media/ {
        auth_request /_media_gate;
        error_page 403 =404 @media_not_found;
        error_page 500 502 503 504 =503 @service_unavailable;
        alias /var/www/media/;
        autoindex off;
        # 上傳後重新編碼的圖片，永遠不進 FastCGI。
        limit_except GET HEAD { deny all; }
    }
    location = /_media_gate {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param REQUEST_URI /api/v1/admin/media/access;
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_pass_request_body off;
        fastcgi_pass $api_upstream;
    }
    location @media_not_found { return 404; }
    client_max_body_size 10m;
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        # X-Original-URI 只該由上面的內部轉址設定；直接打 API 時清空，不讓瀏覽器自行帶入。
        fastcgi_param HTTP_X_ORIGINAL_URI "";
        fastcgi_pass $api_upstream;
        fastcgi_read_timeout 15s;
        # PHP 已送出 Cache-Control 與 nosniff；伺服器層級的同名標頭會再加一次，這裡隱藏 PHP 的版本避免重複。
        fastcgi_hide_header Cache-Control;
        fastcgi_hide_header X-Content-Type-Options;
        # Nginx 自己產生的錯誤（檔案過大、PHP 無回應）也回與 API 相同格式的 JSON，前端才能顯示正確訊息。
        error_page 413 = @api_payload_too_large;
        error_page 502 503 504 = @api_unavailable;
    }
    location @api_payload_too_large {
        default_type application/json;
        return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"上傳內容過大。","fieldErrors":{},"requestId":"$request_id"}';
    }
    location @api_unavailable {
        default_type application/json;
        return 503 '{"code":"SERVICE_UNAVAILABLE","message":"服務暫時無法使用，請稍後重試。","fieldErrors":{},"requestId":"$request_id"}';
    }
    location ~ ^/(?:planner|favorites|change-password)\.html$ {
        if ($http_host != $canonical_authority) {
            return 302 $canonical_origin$request_uri;
        }
        if ($member_page_needs_login) {
            return 302 $canonical_origin/login.html?returnTo=$uri;
        }
        try_files $uri =404;
    }
    location / {
        if ($http_host != $canonical_authority) {
            return 302 $canonical_origin$request_uri;
        }
        try_files $uri $uri/ =404;
    }
}

# Preview the original client prototype. No application API is implemented.
server {
    listen 80;
    server_name _;
    root /var/www/prototype;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~ (^|/)\. { return 404; }
    location ~* \.(php|sql|md|ndjson|ya?ml|ini|xlsx|env)$ { return 404; }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}

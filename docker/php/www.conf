[www]
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; 不使用預設的 IP／request URI 紀錄格式（URI 可能含密碼重設 token），存取紀錄改由 Nginx 只記安全的 path。
access.format = "%t %m %s request=%{X-Request-Id}o"
; 處理程序數：每個公開頁與媒體請求都會先經過 PHP 確認發布狀態，預設的 5 個 worker 容易排隊。
; 一般請求只用到 20 MB 上下，16 個 worker 在 2 GB 記憶體的主機上仍有餘裕；主機規格不同時依實測調整。
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; 定期換新 worker，避免長時間累積的記憶體占用。
pm.max_requests = 500
; Nginx 15 秒就放棄等待；超過 30 秒的請求一定已無人接收，直接結束才能把 worker 還回來。
request_terminate_timeout = 30s

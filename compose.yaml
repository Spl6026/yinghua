name: yinghua

# 共用 image、環境與掛載；FPM 專用的健康檢查不在這裡宣告。
x-php-common: &php-common
  # PDO 的連線逾時管不到 glibc 的 DNS 查詢，服務名稱查詢的逾時也一併限制。
  dns_opt: ["timeout:1", "attempts:1", "ndots:0"]
  image: yinghua-app
  working_dir: /var/www/app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: development
  environment: &php-environment
    APP_ENV: ${APP_ENV:-local}
    APP_VERSION: ${APP_VERSION:-development}
    APP_URL: ${APP_URL:-http://localhost:8080}
    APP_KEY: ${APP_KEY:?Run scripts/setup-env.ps1 first}
    APP_TIMEZONE: Asia/Taipei
    DB_HOST: db
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-yinghua}
    DB_USERNAME: ${DB_USERNAME:-spl}
    DB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-env.ps1 first}
    SESSION_SECURE: ${SESSION_SECURE:-false}
    AUTH_SESSION_SECONDS: ${AUTH_SESSION_SECONDS:-43200}
    AUTH_IDLE_SECONDS: ${AUTH_IDLE_SECONDS:-1800}
    CSRF_SECONDS: ${CSRF_SECONDS:-3600}
    CAPTCHA_SECONDS: ${CAPTCHA_SECONDS:-300}
    CAPTCHA_ATTEMPTS: ${CAPTCHA_ATTEMPTS:-3}
    PASSWORD_RESET_SECONDS: ${PASSWORD_RESET_SECONDS:-1800}
    TERMS_VERSION: ${TERMS_VERSION:-2026-11-02}
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-none}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.test}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-映畫竹塹}
    GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    PUBLICATION_PATH: /var/www/publication
    MEDIA_PATH: /var/www/media
    FRONTEND_SOURCE_PATH: /var/www/frontend-source
  volumes:
    - ./tools/php:/var/www/tools
    - vendor_data:/var/www/tools/vendor
    - ./backend:/var/www/app
    - backend_vendor_data:/var/www/app/vendor
    - ./frontend:/var/www/frontend-source:ro
    - publication_data:/var/www/publication
    - media_data:/var/www/media
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

x-fpm-healthcheck: &fpm-healthcheck
  test: ["CMD", "php", "-r", "exit(is_resource(@fsockopen('127.0.0.1', 9000)) ? 0 : 1);"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 15s

x-web-common: &web-common
  image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
  environment: &web-environment
    API_UPSTREAM: app:9000
    CANONICAL_ORIGIN: ${APP_URL:-http://localhost:8080}
    NGINX_ENVSUBST_FILTER: ^(API_UPSTREAM|CANONICAL_ORIGIN)$
  healthcheck:
    # 容器內檢查也使用正式 Host，避免跟隨轉向到宿主機的外部 port。
    test:
      - CMD-SHELL
      - >-
        canonical_authority=$${CANONICAL_ORIGIN#*://};
        canonical_authority=$${canonical_authority%%/*};
        wget -q -O /dev/null --header="Host: $$canonical_authority" http://127.0.0.1/
    interval: 15s
    timeout: 5s
    retries: 3
  restart: unless-stopped

services:
  frontend:
    image: node:24-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
    working_dir: /frontend
    environment:
      # 固定頁使用目前運行的網址，不把 localhost 寫死在正式 HTML 裡。
      APP_URL: ${APP_URL:-http://localhost:8080}
      TERMS_VERSION: ${TERMS_VERSION:-2026-11-02}
    command: ["node", "scripts/build.mjs"]
    volumes:
      - ./frontend:/frontend
    restart: "no"

  app:
    <<: *php-common
    healthcheck: *fpm-healthcheck

  # CLI worker 沒有 FPM 連接埠；Compose 以 running 判斷是否已啟動。
  publisher:
    <<: *php-common
    user: www-data
    command: ["php", "bin/console.php", "content:watch"]
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy

  web:
    <<: *web-common
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./frontend/dist:/var/www/frontend:ro
      - publication_data:/var/www/publication:ro
      - media_data:/var/www/media:ro
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully

  db:
    image: mariadb:12.3@sha256:2bdff1534a7e569fecaf4b10b66ad0d410806e382d9db29ba305448addda97c4
    # 讓本機 DBeaver 等工具連線；只綁定 loopback，容器內仍用 db:3306。
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-yinghua}
      MARIADB_USER: ${DB_USERNAME:-spl}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-env.ps1 first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/setup-env.ps1 first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    volumes:
      - mail_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # 選用隔離測試服務：明確覆寫資料庫、發布／媒體 volumes 與來源。
  app-test:
    profiles: ["test"]
    <<: *php-common
    healthcheck: *fpm-healthcheck
    environment:
      <<: *php-environment
      APP_ENV: test
      APP_URL: http://localhost:8081
      DB_DATABASE: yinghua_test
    volumes:
      - ./tools/php:/var/www/tools
      - vendor_data:/var/www/tools/vendor
      - ./backend:/var/www/app
      - backend_vendor_data:/var/www/app/vendor
      - ./frontend:/var/www/frontend-source:ro
      - publication_test_data:/var/www/publication
      - media_test_data:/var/www/media
    restart: "no"

  web-test:
    profiles: ["test"]
    <<: *web-common
    ports:
      - "127.0.0.1:8081:80"
    environment:
      <<: *web-environment
      API_UPSTREAM: app-test:9000
      CANONICAL_ORIGIN: http://localhost:8081
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./frontend/dist:/var/www/frontend:ro
      - publication_test_data:/var/www/publication:ro
      - media_test_data:/var/www/media:ro
    depends_on:
      app-test:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    restart: "no"

volumes:
  db_data:
  vendor_data:
  backend_vendor_data:
  mail_data:
  publication_data:
  media_data:
  publication_test_data:
  media_test_data:

# 獨立的正式環境設定，禁止與 compose.yaml 疊加；不含測試服務或開發來源掛載。
name: ${PRODUCTION_PROJECT:?Set a distinct production project}

x-runtime: &runtime
  dns_opt: ["timeout:1", "attempts:1", "ndots:0"]
  image: ${RELEASE_APP_IMAGE:?Use an immutable release image}
  build: &release-build
    context: .
    dockerfile: docker/php/Dockerfile
    target: release
    args:
      APP_VERSION: ${APP_VERSION:?Set a public release label}
      VCS_REF: ${RELEASE_COMMIT:?Set the full source commit}
      APP_URL: ${APP_URL:?Set the HTTPS origin}
      TERMS_VERSION: ${TERMS_VERSION:?Set the reviewed policy version}
  environment: &environment
    APP_ENV: production
    APP_VERSION: ${APP_VERSION:?Set release label}
    APP_URL: ${APP_URL:?Set HTTPS origin}
    APP_KEY: ${APP_KEY:?Set a persistent secret}
    SESSION_SECURE: "true"
    DB_HOST: db
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:?Set database}
    DB_USERNAME: ${DB_USERNAME:-spl}
    DB_PASSWORD: ${DB_PASSWORD:?Set password}
    TERMS_VERSION: ${TERMS_VERSION:?Set policy version}
    SMTP_HOST: ${SMTP_HOST:?Set SMTP host}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?Set sender}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-映畫竹塹}
    GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    PUBLICATION_PATH: /var/www/publication
    MEDIA_PATH: /var/www/media
    FRONTEND_SOURCE_PATH: /var/www/frontend-source
  volumes:
    - media:/var/www/media
    - publication:/var/www/publication
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: mariadb:12.3@sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?Set database}
      MARIADB_USER: ${DB_USERNAME:-spl}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set root password}
    # InnoDB 緩衝區要小於容器記憶體上限，主機規格不同時以 DB_BUFFER_POOL／DB_MEMORY_LIMIT 調整。
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=${DB_BUFFER_POOL:-512M}"]
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  app:
    <<: *runtime
    # 16 個 PHP-FPM worker 一般各用 20–40 MB；上限防止單一失控請求拖垮整台主機。
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    healthcheck:
      # FPM 存活與核心 readiness 分開，空庫 migration 前仍可運行受控 CLI。
      test: ["CMD", "php", "-r", "exit(is_resource(@fsockopen('127.0.0.1',9000)) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 3

  publisher:
    <<: *runtime
    user: www-data
    command: ["php", "bin/console.php", "content:watch"]
    mem_limit: ${PUBLISHER_MEMORY_LIMIT:-512m}
    # 發布程序每 10 秒一輪並更新心跳檔；超過 2 分鐘沒更新代表卡住，容器會標成 unhealthy。
    # Compose 不會自動重啟 unhealthy 的容器，需由外部監控告警或重啟（見 docs/P0-OPERATIONS.md）。
    healthcheck:
      test: ["CMD", "php", "-r", "exit(time() - (int) @filemtime(sys_get_temp_dir() . '/yinghua-publisher-heartbeat') < 120 ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  web:
    image: ${RELEASE_WEB_IMAGE:?Use a matching immutable web image}
    mem_limit: ${WEB_MEMORY_LIMIT:-256m}
    build:
      <<: *release-build
      target: release-web
    environment:
      API_UPSTREAM: app:9000
      CANONICAL_ORIGIN: ${APP_URL:?Set HTTPS origin}
      NGINX_ENVSUBST_FILTER: ^(API_UPSTREAM|CANONICAL_ORIGIN)$
    ports:
      - "${PRODUCTION_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${PRODUCTION_BIND_ADDRESS:-0.0.0.0}:${HTTP_REDIRECT_PORT:-80}:80"
    volumes:
      - type: bind
        source: ${PRODUCTION_TLS_DIRECTORY:?Set certificate directory}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
      - media:/var/www/media:ro
      - publication:/var/www/publication:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/_alive"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  database:
  media:
  publication:

<!-- 重要操作的確認視窗依 WAI alertdialog 模式關聯標題與說明；模態行為與取消時的焦點仍交給原生 showModal 處理。 -->
<dialog id="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message"><form method="dialog"><h2 id="confirm-title">確認操作</h2><p id="confirm-message"></p><div class="dialog-actions"><button class="button button-outline" value="cancel" autofocus>取消</button><button class="button button-dark" value="confirm">確認</button></div></form></dialog>

<body>
<a class="skip-link" href="#main-content">跳到主要內容</a>
<div class="site-shell">{{SITE_HEADER}}<main id="main-content" tabindex="-1">
<div class="page inner-page active">
<div class="inner-hero planner-hero">
<p class="eyebrow light">MAKE IT YOURS</p>
<h1>把新竹，排進<br>
<span>你的日常。</span>
</h1>
<p>先收藏想去的地方，再把它們排進旅行計畫。<br>每段旅程，都從一個喜歡的念頭開始。</p>
</div>
<div class="section-pad planner-layout">
<aside class="planner-aside">
<div class="planner-user">
<div class="avatar">映</div>
<div>
<span>WELCOME BACK</span>
<strong id="planner-user-name">城市旅人</strong>
</div>
<a class="text-link" href="login.html">登入同步 <span>↗</span>
</a>
</div>
<div class="planner-card">
<p class="eyebrow">YOUR NEXT TRIP</p>
<h3>新竹・慢慢走</h3>
<label for="trip-date">旅行日期</label>
<input id="trip-date" type="date" value="2026-10-17">
<label for="trip-title">行程名稱</label>
<input id="trip-title" type="text" value="竹塹光影散步">
<button class="button button-dark full-button" id="save-trip">儲存行程 <span>↗</span>
</button>
</div>
<div class="suggestion-card">
<p class="eyebrow">EDITOR’S ROUTE</p>
<h3>一日光影・老城散步</h3>
<p>影像博物館 → 東門市場 → 新竹公園・麗池</p>
<button class="text-link" id="use-route">套用推薦行程 <span>→</span>
</button>
</div>
</aside>
<div class="itinerary">
<div class="itinerary-top">
<div>
<p class="eyebrow">示意行程 · 17 OCT</p>
<h2>行程安排</h2>
</div>
<button class="button button-outline" id="add-stop">＋ 新增地點</button>
</div>
<div class="itinerary-list" id="itinerary-list">
</div>
<div class="itinerary-empty" id="itinerary-empty" hidden>
<span>✳</span>
<p>旅程還沒有景點</p>
<a class="text-link" href="/explore.html">去探索城市散策 <span>→</span>
</a>
</div>
<p class="demo-note">以上為原始交付的唯讀示意行程。行程與收藏功能將於後續階段開放；此頁目前不會保存行程。</p>
</div>
</div>
</div>
</main>{{SITE_FOOTER}}

<div class="toast" id="toast" role="status" aria-live="polite">
</div>
</div>

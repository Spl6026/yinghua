<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f0e6">
<meta name="robots" content="noindex,follow">
<meta name="googlebot" content="noindex,follow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>我的收藏｜映畫竹塹</title>
<meta name="description" content="查看你收藏的新竹景點、美食與在地店家，加入自己的旅行計畫。">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/phase2.css">
<link rel="stylesheet" href="/assets/css/phase6.css">
</head>
<body>
<a class="skip-link" href="#main-content">跳到主要內容</a>
<div class="site-shell">
{{SITE_HEADER}}
<main id="main-content" tabindex="-1">
<div class="page inner-page active">
<div class="inner-hero">
<p class="eyebrow light">YOUR CITY COLLECTION</p>
<h1>把喜歡的地方，<br><span>留在這裡。</span></h1>
<p>收藏想去的景點、美食與店家，為下一次散步留下靈感。</p>
</div>
<section class="section-pad" aria-labelledby="favorites-heading">
<div class="section-heading"><div><p class="eyebrow">MY FAVORITES</p><h2 id="favorites-heading">我的收藏</h2></div><a class="text-link" href="/planner.html">查看旅行計畫 <span>↗</span></a></div>
<p id="favorites-status" class="form-status" role="status" tabindex="-1">正在確認登入狀態…</p>
<button type="button" class="button button-outline" id="favorites-retry" hidden>重新讀取</button>
<div class="place-grid" id="favorites-list" aria-busy="true"></div>
<nav class="list-pagination" aria-label="收藏分頁">
<button type="button" class="button button-outline" id="favorites-previous" disabled>上一頁</button>
<button type="button" class="button button-outline" id="favorites-next" disabled>下一頁</button>
</nav>
</section>
</div>
</main>
{{SITE_FOOTER}}
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="/assets/js/public.js"></script>
<script type="module" src="/assets/js/pages/favorites.js"></script>
</body>
</html>

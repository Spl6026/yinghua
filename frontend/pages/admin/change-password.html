<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>管理員更改密碼｜映畫竹塹</title>
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/phase2.css">
</head>
<body data-auth-kind="admin" data-auth-mode="change-password">
<a class="skip-link" href="#main-content">跳到主要內容</a>
<div class="site-shell">{{SITE_HEADER}}
<main id="main-content" tabindex="-1"><div class="page inner-page active">
<section class="section-pad account-page"><div class="account-card">
<p class="eyebrow">ADMIN / ACCOUNT</p>
<h1>管理員更改密碼</h1><p>登入後台，管理映畫竹塹的城市內容。</p>
<form id="auth-form">
<div class="form-field">
<label for="currentPassword">目前密碼</label>
<input id="currentPassword" name="currentPassword" type="password" required autocomplete="current-password" maxlength="128">
</div>
<div class="form-field">
<label for="password">密碼（8–128 字元）</label>
<input id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password">
</div>
<div class="form-field">
<label for="passwordConfirmation">確認密碼</label>
<input id="passwordConfirmation" name="passwordConfirmation" type="password" required minlength="8" maxlength="128" autocomplete="new-password">
</div>
<p class="form-error form-status" role="status" aria-live="polite" tabindex="-1"></p>
<button class="button button-dark full-button" type="submit">更改密碼</button>
</form><p class="account-switch"><a href="/admin/index.html" data-auth-return>回後台</a></p>
<p class="account-switch"><button class="button button-outline" type="button" data-auth-logout hidden>登出並切換帳號</button></p>
</div></section></div></main>
{{SITE_FOOTER}}{{DIALOG}}<div id="toast" class="toast" role="status" aria-live="polite"></div></div>
<script type="module" src="/assets/js/auth.js"></script>
</body>
</html>

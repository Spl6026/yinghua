<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>編輯店家優惠｜映畫竹塹後台</title><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/css/style.css"><link rel="stylesheet" href="/assets/css/states.css"><link rel="stylesheet" href="/assets/css/places.css"><link rel="stylesheet" href="/assets/css/content-admin.css"><link rel="stylesheet" href="/assets/css/ui-consistency.css">
</head><body data-module="offers" data-action="edit" data-page="offer-edit"><a class="skip-link" href="#main-content">跳到主要內容</a><main id="main-content" tabindex="-1"><div class="admin-wrap">{{ADMIN_SIDEBAR}}<div class="admin-main">{{ADMIN_TOPBAR}}<div class="admin-content"><div class="admin-page-heading"><div><p class="eyebrow">CONTENT MANAGEMENT / OFFERS</p><h1>編輯店家優惠</h1><p>資料保存與公開頁面同步分開顯示。</p></div><button id="reload-content-form" type="button" class="button button-outline">重新載入</button></div><section class="admin-panel"><form id="content-form" method="post" autocomplete="off"><p id="content-form-status" class="form-status" role="status" tabindex="-1"></p><div class="admin-form-grid"><div class="admin-field full"><label for="content-title">優惠標題 *</label><input id="content-title" name="title" type="text" required spellcheck="false" autocomplete="off"></div>
<div class="admin-field"><label for="content-merchantId">合作店家 *</label><select id="content-merchantId" name="merchantId" required><option value="">請選擇合作店家</option></select></div>
<div class="admin-field full"><label for="merchant-query">搜尋合作店家</label><div class="inline-actions"><input id="merchant-query" type="search" placeholder="店家名稱" spellcheck="false" autocomplete="off"><button id="search-merchants" type="button" class="button button-outline">尋找店家</button><button id="merchant-previous" type="button" class="button button-outline">上一頁店家</button><button id="merchant-next" type="button" class="button button-outline">下一頁店家</button></div><p id="merchant-status" class="form-status" role="status"></p><details id="merchant-editor"><summary>新增／修正合作店家</summary><p class="helper-text">店家可獨立存在，不必先建立景點。修正選定店家會影響引用它的所有優惠，需另按按鈕確認保存。</p><div class="admin-form-grid"><div class="admin-field"><label for="merchant-name">店家名稱</label><input id="merchant-name" type="text" spellcheck="false" autocomplete="off"></div><div class="admin-field"><label for="merchant-district">行政區（選填）</label><input id="merchant-district" type="text" spellcheck="false" autocomplete="off"></div><div class="admin-field"><label for="merchant-address">地址（選填）</label><input id="merchant-address" type="text" spellcheck="false" autocomplete="off"></div><div class="admin-field"><label for="merchant-phone">電話（選填）</label><input id="merchant-phone" type="tel" spellcheck="false" autocomplete="off"></div><div class="admin-field"><label for="merchant-website">官方網站（選填）</label><input id="merchant-website" type="url" spellcheck="false" autocomplete="off"></div><div class="admin-field"><label for="merchant-profile-status">店家狀態</label><select id="merchant-profile-status"><option value="active">啟用</option><option value="inactive">停用</option></select></div></div><div class="inline-actions"><button type="button" id="create-merchant" class="button button-outline" data-write>建立新店家並選取</button><button type="button" id="update-merchant" class="button button-outline" data-write>修正選定店家（影響所有引用優惠）</button></div></details></div><div class="admin-field full"><label for="content-discount">優惠內容 *</label><input id="content-discount" name="discount" type="text" required spellcheck="false" autocomplete="off"></div>
<div class="admin-field"><label for="content-validFrom">開始日期（選填）</label><input id="content-validFrom" name="validFrom" type="date" spellcheck="false" autocomplete="off"></div>
<div class="admin-field"><label for="content-validTo">結束日期（選填）</label><input id="content-validTo" name="validTo" type="date" spellcheck="false" autocomplete="off"></div>
<div class="admin-field"><label for="content-status">上架狀態</label><select id="content-status" name="status"><option value="published">發布／排程</option><option value="draft">草稿</option><option value="archived">下架</option></select></div>
<div class="admin-field"><label for="content-publishAt">發布時間（台北；留空立即發布）</label><input id="content-publishAt" name="publishAt" type="datetime-local" step="1" spellcheck="false" autocomplete="off"></div>
<div class="admin-field full"><label for="content-description">優惠介紹（選填）</label><textarea id="content-description" name="description" rows="5"></textarea></div>
<div class="admin-field full"><label for="content-terms">使用方式與注意事項 *</label><textarea id="content-terms" name="terms" rows="5" required></textarea></div>
<div class="admin-field"><label for="content-slug">網址識別（留空自動產生）</label><input id="content-slug" name="slug" type="text" spellcheck="false" autocomplete="off"></div>
<div class="admin-field"><label for="content-coverUrl">封面圖片網址（選填）</label><input id="content-coverUrl" name="coverUrl" type="url" spellcheck="false" autocomplete="off"></div>
<input id="content-coverMediaId" name="coverMediaId" type="hidden" spellcheck="false" autocomplete="off"><div class="admin-field"><label for="content-image">或上傳封面圖片（選填）</label><input id="content-image" name="image" type="file" accept="image/jpeg,image/png,image/webp" spellcheck="false" autocomplete="off"></div><div class="admin-field"><label for="content-coverAlt">封面替代文字（有圖片時必填）</label><input id="content-coverAlt" name="coverAlt" type="text" spellcheck="false" autocomplete="off"></div>
<div class="admin-field"><label for="content-coverSource">圖片來源（選填）</label><input id="content-coverSource" name="coverSource" type="text" spellcheck="false" autocomplete="off"></div>
<div class="admin-field"><label for="content-coverLicense">圖片授權（選填）</label><input id="content-coverLicense" name="coverLicense" type="text" spellcheck="false" autocomplete="off"></div>
<div class="admin-field full"><button id="upload-content-image" type="button" class="button button-outline" data-write>上傳封面圖片</button><p class="helper-text">JPEG／PNG／WebP，最多8 MiB、邊長6000及1200萬像素；檢查／解碼／重編碼，非病毒掃描。先上傳再儲存內容。</p><p id="content-media-status" class="form-status" role="status" tabindex="-1"></p><img id="content-image-preview" src="/assets/image-placeholder.svg" alt="封面預覽" width="360" height="240" class="content-image-preview" hidden></div><div class="admin-field"><label for="content-seoTitle">SEO標題覆寫（選填）</label><input id="content-seoTitle" name="seoTitle" type="text" spellcheck="false" autocomplete="off"></div>
<div class="admin-field"><label for="content-seoDescription">SEO摘要覆寫（選填）</label><textarea id="content-seoDescription" name="seoDescription" rows="5"></textarea></div>
</div><div class="admin-form-actions"><a class="button button-outline" id="content-cancel" href="/admin/offers.html">取消</a><button class="button button-dark" type="submit">儲存優惠 ↗</button><a hidden id="content-another" href="/admin/offer-add.html">再新增一筆</a></div></form></section></div></div></div></main>{{DIALOG}}<div class="toast" id="toast" role="status" aria-live="polite"></div><script type="module" src="/assets/js/admin.js"></script></body></html>

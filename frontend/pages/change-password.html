<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>會員更改密碼｜映畫竹塹</title>
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/states.css">
<link rel="stylesheet" href="/assets/css/ui-consistency.css">
</head>
<body data-auth-kind="member" data-auth-mode="change-password">
<a class="skip-link" href="#main-content">跳到主要內容</a>
<div class="site-shell">{{SITE_HEADER}}
<main id="main-content" tabindex="-1"><div class="page inner-page active">
<section class="section-pad account-page"><div class="account-card">
<p class="eyebrow">JOIN THE CITY STORY</p>
<h1>更改密碼</h1><p>輸入目前的密碼，再設定新密碼。</p>
<form method="post" id="auth-form">
<div class="form-field">
<label for="currentPassword">目前密碼</label>
<input id="currentPassword" name="currentPassword" type="password" required autocomplete="current-password" spellcheck="false">
</div>
<div class="form-field">
<label for="password">密碼（8–128 字元）</label>
<input id="password" name="password" type="password" required autocomplete="new-password" spellcheck="false">
</div>
<div class="form-field">
<label for="passwordConfirmation">確認密碼</label>
<input id="passwordConfirmation" name="passwordConfirmation" type="password" required autocomplete="new-password" spellcheck="false">
</div>
<p class="form-error form-status" role="status" aria-live="polite" tabindex="-1"></p>
<button class="button button-dark full-button" type="submit">更改密碼</button>
</form><p class="account-switch"><a href="/index.html" data-auth-return>回首頁</a></p>
</div></section></div></main>
{{SITE_FOOTER}}{{DIALOG}}<div id="toast" class="toast" role="status" aria-live="polite"></div></div>
<script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
